apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-wildcard-host
spec:
  rules:
  - host: "priceline.com"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: service1
            port:
              number: 80
      - pathType: Prefix
        path: "/cars"
        backend:
          service:
            name: service2
            port:
              number: 80              
  - host: "cruises.priceline.com"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: service3
            port:
              number: 80
      - pathType: Prefix
        path: "/boats"
        backend:
          service:
            name: service3
            port:
              number: 80              
