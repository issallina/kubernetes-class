apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    app: nginx2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx2
  template:
    metadata:
      labels:
        app: nginx2
    spec:
      containers:
      - name: nginx
        image: gcr.io/google-samples/hello-app:2.0
        ports:
        - containerPort: 8080
